apply plugin: 'com.android.application'

base {
    archivesName = 'instasave'
}

// Release signing credentials live outside git, in <root>/keystore.properties.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'app.instasave'
    compileSdk 34

    defaultConfig {
        applicationId 'app.instasave'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        manifestPlaceholders = [appLabel: 'Instasave']
    }

    signingConfigs {
        if (!keystoreProperties.isEmpty()) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        // Separate package and name so a debug build installs next to the release one instead of
        // clashing with its signature.
        debug {
            applicationIdSuffix '.debug'
            manifestPlaceholders = [appLabel: 'Instasave Debug']
        }
        release {
            signingConfig signingConfigs.findByName('release')
        }
    }

    // Versioned name for release APKs only; debug keeps instasave-debug.apk for run-emulator.sh.
    applicationVariants.configureEach { variant ->
        if (variant.buildType.name == 'release') {
            variant.outputs.configureEach {
                def suffix = variant.signingConfig ? '' : '-unsigned'
                outputFileName = "Instasave-${variant.versionName}-release${suffix}.apk"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The high-resolution branding source is kept in the repository, but is not a runtime asset.
    // There are currently no assets required by the application at runtime.
    sourceSets {
        main.assets.srcDirs = []
    }
}
