apply plugin: 'com.android.application'

android {
    namespace 'app.instasave'
    compileSdk 34

    defaultConfig {
        applicationId 'app.instasave'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
